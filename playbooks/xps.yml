- name: Configure XPS server
  hosts: xps
  become: true
  vars_files:
    - ../user_passwords.yml
  roles:
    - network
    - sshd
    - tailscale
    - daniel
    - common
    - laptop_always_on
    - disks
    - makemkv
    - docker
    - caddy
    # Before every application that authenticates against it: the role sets
    # facts holding the per-client secrets, which those roles read.
    - authelia
    - cadvisor
    - blackbox
    - imagewatch
    - telegrambot
    - plex
    - alertmanager
    - prometheus
    - grafana
    - kavita
    - planka
    - actualbudget
    - vikunja
    - ftp
    - timemachine
    - immich
    - vaultwarden
    - backup
