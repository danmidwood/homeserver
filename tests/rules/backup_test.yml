rule_files:
  - ../../roles/prometheus/files/rules/backup.yml

evaluation_interval: 1m

tests:
  # A future-dated timestamp (recorded value far ahead of promtool's clock,
  # as would happen if the host's clock was wrong when the backup ran) must
  # fire BackupTimestampInFuture. This series used to be asserted to leave
  # BackupStale silent, which is true but vacuous — that assertion still
  # passes even with BackupStale deleted entirely, since it never exercises
  # the rule that actually matters for a future-dated timestamp.
  # promtool's clock starts at 0, so the series carries a large absolute
  # unix timestamp and we evaluate far enough in for time() to exceed it.
  - interval: 1h
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '1000000+0x40'
    alert_rule_test:
      # At 30h of evaluation time, time() is 108000 and the recorded
      # timestamp is 1000000, i.e. 892000s (10d 7h 46m 40s) ahead of the
      # clock — comfortably over the 1h threshold.
      - eval_time: 30h
        alertname: BackupTimestampInFuture
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps
              job: node
            exp_annotations:
              summary: "Backup timestamp is in the future"
              description: "The last recorded restic backup success is 10d 7h 46m 40s ahead of this server's clock. While this holds, BackupStale cannot fire and the backup is effectively unmonitored. The likely cause is the host's clock being wrong — check for a dead RTC battery and whether systemd-timesyncd has synced — not that the backup is somehow ahead of schedule."

  # A normal, past timestamp must leave BackupTimestampInFuture silent.
  - interval: 1h
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupTimestampInFuture
        exp_alerts: []

  # A backup whose timestamp is 27 hours behind promtool's clock IS stale.
  - interval: 1h
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '0+0x40'
    alert_rule_test:
      # 25h elapsed: under the 26h threshold, must stay silent.
      - eval_time: 25h
        alertname: BackupStale
        exp_alerts: []
      # 27h elapsed: over the threshold, must fire.
      - eval_time: 27h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps
              job: node
            exp_annotations:
              summary: "No successful backup in over 26 hours"
              description: "The last successful restic backup to B2 finished 1d 3h 0m 0s ago. The daily timer may have failed to run at all — check `systemctl list-timers restic-backup.timer` and `journalctl -u restic-backup.service`."

  # The metric existing at all keeps BackupMetricMissing quiet.
  - interval: 1h
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupMetricMissing
        exp_alerts: []

  # No series at all: BackupMetricMissing fires once its `for:` elapses.
  - interval: 1h
    input_series: []
    alert_rule_test:
      # Before the 1h `for:` has elapsed, it must stay silent.
      - eval_time: 30m
        alertname: BackupMetricMissing
        exp_alerts: []
      - eval_time: 2h
        alertname: BackupMetricMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: "Backup metrics are missing entirely"
              description: "node_exporter is not exporting restic_backup_last_success_timestamp_seconds, so BackupStale cannot fire and the backup is effectively unmonitored. Either no backup has succeeded since this was deployed, or the textfile collector is broken — check /var/lib/node_exporter/textfile_collector/restic_backup.prom exists and node_textfile_scrape_error is 0."

  # A drill that ran recently: silence.
  - interval: 1h
    input_series:
      - series: 'restic_restore_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 2h
        alertname: RestoreDrillStale
        exp_alerts: []
      - eval_time: 2h
        alertname: RestoreDrillMetricMissing
        exp_alerts: []

  # A drill that has not succeeded for over ten days. promtool's clock starts
  # at zero, so a timestamp of 0 becomes stale once eval_time passes 10 days.
  - interval: 1h
    input_series:
      - series: 'restic_restore_last_success_timestamp_seconds{instance="xps",job="node"}'
        values: '0+0x400'
    alert_rule_test:
      # Not yet stale at exactly ten days: the rule is a strict `>`, so the
      # threshold itself must pass before it can fire.
      - eval_time: 240h
        alertname: RestoreDrillStale
        exp_alerts: []
      - eval_time: 250h
        alertname: RestoreDrillStale
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
            exp_annotations:
              summary: "The backups have not been proven restorable for over 10 days"
              description: "restic-restore-check has not completed successfully in more than 10 days, so nothing currently confirms the backups can be read back. Run `systemctl start restic-restore-check` and check `journalctl -u restic-restore-check`."

  # No drill has ever run: the staleness rule cannot fire, so absence is its
  # own alert.
  - interval: 1h
    input_series: []
    alert_rule_test:
      - eval_time: 30m
        alertname: RestoreDrillMetricMissing
        exp_alerts: []
      - eval_time: 3h
        alertname: RestoreDrillMetricMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No restore drill has ever succeeded"
              description: "restic_restore_last_success_timestamp_seconds does not exist, so RestoreDrillStale cannot fire and nothing is confirming the backups are restorable. Expected after first provisioning the host, until the first weekly drill runs."
