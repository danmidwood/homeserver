rule_files:
  - ../../roles/prometheus/files/rules/host.yml

evaluation_interval: 1m

tests:
  # 1% free on /mnt/storage, held steady for half an hour.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '1000+0x30'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x30'
    alert_rule_test:
      # Must NOT fire before the 15m `for:` has elapsed.
      - eval_time: 10m
        alertname: DiskSpaceCritical
        exp_alerts: []
      # Must fire once it has.
      - eval_time: 16m
        alertname: DiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has under 5% free"
              description: "/mnt/storage on xps is at 1% free."

  # 40% free is healthy and must never fire.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '40000+0x30'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskSpaceCritical
        exp_alerts: []

  # A read-only filesystem fires almost immediately.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has gone read-only"
              description: "A filesystem remounting itself read-only is usually the first visible sign of a failing disk. Check dmesg on xps."

  # A healthy (writable) filesystem must never fire FilesystemReadOnly.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FilesystemReadOnly
        exp_alerts: []

  # 12% free is low but not critical: warning fires, critical does not.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '12000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has under 15% free"
              description: "/mnt/storage on xps is at 12% free."
      - eval_time: 61m
        alertname: DiskSpaceCritical
        exp_alerts: []

  # 40% free is healthy and must never trigger DiskSpaceLow either.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '40000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts: []

  # A mountpoint excluded from disk-space alerting must never fire, even
  # well under threshold and on a steadily decreasing trend.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sdb1",fstype="ext4",mountpoint="/mnt/seagate"}'
        values: '700-1x420'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sdb1",fstype="ext4",mountpoint="/mnt/seagate"}'
        values: '100000+0x420'
    alert_rule_test:
      - eval_time: 420m
        alertname: DiskSpaceCritical
        exp_alerts: []
      - eval_time: 420m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 420m
        alertname: DiskWillFillSoon
        exp_alerts: []

  # 10% free on /var is above DiskSpaceLow's own threshold but must fire
  # VarSpaceCritical instead, and must not also fire DiskSpaceLow.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '10000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: VarSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps
              job: node
              device: /dev/sda1
              fstype: ext4
              mountpoint: /var
            exp_annotations:
              summary: "/var has under 15% free"
              description: "/var on xps is at 10% free. A full /var stops Docker and journald writing, which takes the services down."
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts: []

  # 40% free on /var is healthy and must never fire VarSpaceCritical.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '40000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: VarSpaceCritical
        exp_alerts: []

  # Under 10% memory available fires MemoryPressure.
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="xps",job="node"}'
        values: '500+0x30'
      - series: 'node_memory_MemTotal_bytes{instance="xps",job="node"}'
        values: '10000+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: MemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
            exp_annotations:
              summary: "Under 10% memory available"
              description: "xps has 5% of memory available."

  # Half the memory available is healthy and must never fire MemoryPressure.
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="xps",job="node"}'
        values: '5000+0x30'
      - series: 'node_memory_MemTotal_bytes{instance="xps",job="node"}'
        values: '10000+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: MemoryPressure
        exp_alerts: []

  # A sustained 90C package temperature fires CPUThermalThrottle.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps",job="node",chip="platform_coretemp_0",sensor="temp1"}'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
              chip: platform_coretemp_0
              sensor: temp1
            exp_annotations:
              summary: "CPU running at 90C"
              description: "The server is a laptop; sustained high temperature suggests blocked airflow or a failing fan."

  # A cool CPU package must never fire CPUThermalThrottle.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps",job="node",chip="platform_coretemp_0",sensor="temp1"}'
        values: '50+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts: []

  # A hot NVMe drive is not the CPU and must never fire CPUThermalThrottle;
  # NVMe routinely runs past 85C under sustained write.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps",job="node",chip="nvme_nvme0",sensor="temp1"}'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts: []

  # A hot per-core sensor (temp2 = Core 0) on the same chip must never fire
  # CPUThermalThrottle on its own. This is the case the sensor="temp1"
  # filter exists for: platform_coretemp_0 exposes temp1 (package), temp2
  # and temp3 (the two cores) all reading within a degree or two of each
  # other, so without the filter this same series would have produced a
  # second, redundant alert alongside temp1's.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps",job="node",chip="platform_coretemp_0",sensor="temp2"}'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts: []

  # A disk draining at a steady rate, sitting around 26-28% free (well clear
  # of DiskSpaceLow's 15% and DiskSpaceCritical's 5%), still projects to run
  # dry within 4 days on its current trend. DiskWillFillSoon must fire even
  # though nothing else in the file does.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '57200-10x420'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '200000+0x420'
    alert_rule_test:
      - eval_time: 421m
        alertname: DiskWillFillSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage is projected to fill within 4 days"
              description: "Based on the last 6 hours of usage, /mnt/storage on xps runs out of space within 4 days."
      - eval_time: 421m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 421m
        alertname: DiskSpaceCritical
        exp_alerts: []

  # The same disk holding perfectly flat has no trend to extrapolate and must
  # never fire DiskWillFillSoon, no matter how long it is watched.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '57200+0x420'
      - series: 'node_filesystem_size_bytes{instance="xps",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '200000+0x420'
    alert_rule_test:
      - eval_time: 421m
        alertname: DiskWillFillSoon
        exp_alerts: []

  # A dead scrape target means every rule reading from it has gone dark, not
  # that everything it would have alerted on is fine. TargetDown must fire
  # once the target has been unreachable for the full for: duration.
  - interval: 1m
    input_series:
      - series: 'up{instance="xps",job="node"}'
        values: '0+0x15'
    alert_rule_test:
      - eval_time: 9m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 11m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
            exp_annotations:
              summary: "node target xps is down"
              description: "Prometheus has not been able to scrape xps for over 10 minutes. Every other rule that depends on metrics from this target has stopped evaluating and gone silent as a result — that silence does not mean things are healthy, it means nothing is being checked."

  # A target that is up must never fire TargetDown.
  - interval: 1m
    input_series:
      - series: 'up{instance="xps",job="node"}'
        values: '1+0x15'
    alert_rule_test:
      - eval_time: 11m
        alertname: TargetDown
        exp_alerts: []

  # A box that booted two minutes ago is news; one up for days is not.
  - interval: 1m
    input_series:
      - series: 'node_time_seconds{instance="xps",job="node"}'
        values: '1000000+60x10'
      - series: 'node_boot_time_seconds{instance="xps",job="node"}'
        values: '999900+0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HostRebooted
        exp_alerts:
          - exp_labels:
              severity: info
              instance: xps
              job: node
            exp_annotations:
              summary: "xps rebooted"
              description: "Uptime is under five minutes. A server that reboots on its own is worth knowing about."
      # Once uptime has passed five minutes, HostRebooted must go silent.
      - eval_time: 10m
        alertname: HostRebooted
        exp_alerts: []

  # A clock that has stopped being disciplined by NTP. This is not a
  # cosmetic complaint: BackupStale, SmartMetricsStale and
  # BackupTimestampInFuture all compare a recorded timestamp against
  # time(), so a clock that drifts or jumps can silence them while every
  # indicator stays green.
  - interval: 1m
    input_series:
      - series: 'node_timex_sync_status{instance="xps",job="node"}'
        values: '0+0x40'
    alert_rule_test:
      - eval_time: 20m
        alertname: ClockNotSynchronised
        exp_alerts: []
      - eval_time: 35m
        alertname: ClockNotSynchronised
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
            exp_annotations:
              summary: "xps has no time synchronisation"
              description: "The kernel reports the clock is not being disciplined by NTP, so it is free-running and will drift further the longer this lasts. Every alert that compares a timestamp against the current time can be silenced by a wrong clock. Check `timedatectl` and `systemctl status systemd-timesyncd`."

  # A synchronised clock must never fire it, checked well past the for:.
  - interval: 1m
    input_series:
      - series: 'node_timex_sync_status{instance="xps",job="node"}'
        values: '1+0x40'
    alert_rule_test:
      - eval_time: 40m
        alertname: ClockNotSynchronised
        exp_alerts: []

  # A malformed .prom file makes node-exporter drop EVERY textfile metric,
  # so this one rule guards both the backup and the SMART monitoring.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="xps",job="node"}'
        values: '1+0x30'
    alert_rule_test:
      - eval_time: 10m
        alertname: TextfileCollectorError
        exp_alerts: []
      - eval_time: 20m
        alertname: TextfileCollectorError
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps
              job: node
            exp_annotations:
              summary: "node-exporter cannot read a textfile metric file"
              description: "A file in /var/lib/node_exporter/textfile_collector failed to parse, and node-exporter responds by dropping ALL textfile metrics — so the backup and SMART rules are currently evaluating nothing. Check that directory for a malformed or partially written .prom file."

  # Parsing cleanly must never fire it, checked well past the for:.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="xps",job="node"}'
        values: '0+0x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: TextfileCollectorError
        exp_alerts: []
