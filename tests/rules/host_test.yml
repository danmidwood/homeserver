rule_files:
  - ../../roles/prometheus/files/rules/host.yml

evaluation_interval: 1m

tests:
  # 1% free on /mnt/storage, held steady for half an hour.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '1000+0x30'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x30'
    alert_rule_test:
      # Must NOT fire before the 15m `for:` has elapsed.
      - eval_time: 10m
        alertname: DiskSpaceCritical
        exp_alerts: []
      # Must fire once it has.
      - eval_time: 16m
        alertname: DiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps.fritz.box:9100
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has under 5% free"
              description: "/mnt/storage on xps.fritz.box:9100 is at 1% free."

  # 40% free is healthy and must never fire.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '40000+0x30'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: DiskSpaceCritical
        exp_alerts: []

  # A read-only filesystem fires almost immediately.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '1+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FilesystemReadOnly
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps.fritz.box:9100
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has gone read-only"
              description: "A filesystem remounting itself read-only is usually the first visible sign of a failing disk. Check dmesg on xps.fritz.box:9100."

  # A healthy (writable) filesystem must never fire FilesystemReadOnly.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_readonly{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '0+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: FilesystemReadOnly
        exp_alerts: []

  # 12% free is low but not critical: warning fires, critical does not.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '12000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps.fritz.box:9100
              job: node
              device: /dev/sda2
              fstype: ext4
              mountpoint: /mnt/storage
            exp_annotations:
              summary: "/mnt/storage has under 15% free"
              description: "/mnt/storage on xps.fritz.box:9100 is at 12% free."
      - eval_time: 61m
        alertname: DiskSpaceCritical
        exp_alerts: []

  # 40% free is healthy and must never trigger DiskSpaceLow either.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '40000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda2",fstype="ext4",mountpoint="/mnt/storage"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts: []

  # A mountpoint excluded from disk-space alerting must never fire, even
  # well under threshold and on a steadily decreasing trend.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sdb1",fstype="ext4",mountpoint="/mnt/seagate"}'
        values: '700-1x420'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sdb1",fstype="ext4",mountpoint="/mnt/seagate"}'
        values: '100000+0x420'
    alert_rule_test:
      - eval_time: 420m
        alertname: DiskSpaceCritical
        exp_alerts: []
      - eval_time: 420m
        alertname: DiskSpaceLow
        exp_alerts: []
      - eval_time: 420m
        alertname: DiskWillFillSoon
        exp_alerts: []

  # 10% free on /var is above DiskSpaceLow's own threshold but must fire
  # VarSpaceCritical instead, and must not also fire DiskSpaceLow.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '10000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: VarSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: xps.fritz.box:9100
              job: node
              device: /dev/sda1
              fstype: ext4
              mountpoint: /var
            exp_annotations:
              summary: "/var has under 15% free"
              description: "/var on xps.fritz.box:9100 is at 10% free. A full /var stops Docker and journald writing, which takes the services down."
      - eval_time: 61m
        alertname: DiskSpaceLow
        exp_alerts: []

  # 40% free on /var is healthy and must never fire VarSpaceCritical.
  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '40000+0x70'
      - series: 'node_filesystem_size_bytes{instance="xps.fritz.box:9100",job="node",device="/dev/sda1",fstype="ext4",mountpoint="/var"}'
        values: '100000+0x70'
    alert_rule_test:
      - eval_time: 61m
        alertname: VarSpaceCritical
        exp_alerts: []

  # Under 10% memory available fires MemoryPressure.
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="xps.fritz.box:9100",job="node"}'
        values: '500+0x30'
      - series: 'node_memory_MemTotal_bytes{instance="xps.fritz.box:9100",job="node"}'
        values: '10000+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: MemoryPressure
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps.fritz.box:9100
              job: node
            exp_annotations:
              summary: "Under 10% memory available"
              description: "xps.fritz.box:9100 has 5% of memory available."

  # Half the memory available is healthy and must never fire MemoryPressure.
  - interval: 1m
    input_series:
      - series: 'node_memory_MemAvailable_bytes{instance="xps.fritz.box:9100",job="node"}'
        values: '5000+0x30'
      - series: 'node_memory_MemTotal_bytes{instance="xps.fritz.box:9100",job="node"}'
        values: '10000+0x30'
    alert_rule_test:
      - eval_time: 16m
        alertname: MemoryPressure
        exp_alerts: []

  # A sustained 90C package temperature fires CPUThermalThrottle.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps.fritz.box:9100",job="node",chip="platform_coretemp_0",sensor="temp1"}'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: xps.fritz.box:9100
              job: node
              chip: platform_coretemp_0
              sensor: temp1
            exp_annotations:
              summary: "CPU running at 90C"
              description: "The server is a laptop; sustained high temperature suggests blocked airflow or a failing fan."

  # A cool CPU package must never fire CPUThermalThrottle.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps.fritz.box:9100",job="node",chip="platform_coretemp_0",sensor="temp1"}'
        values: '50+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts: []

  # A hot NVMe drive is not the CPU and must never fire CPUThermalThrottle;
  # NVMe routinely runs past 85C under sustained write.
  - interval: 1m
    input_series:
      - series: 'node_hwmon_temp_celsius{instance="xps.fritz.box:9100",job="node",chip="nvme_nvme0",sensor="temp1"}'
        values: '90+0x20'
    alert_rule_test:
      - eval_time: 11m
        alertname: CPUThermalThrottle
        exp_alerts: []

  # A box that booted two minutes ago is news; one up for days is not.
  - interval: 1m
    input_series:
      - series: 'node_time_seconds{instance="xps.fritz.box:9100",job="node"}'
        values: '1000000+60x10'
      - series: 'node_boot_time_seconds{instance="xps.fritz.box:9100",job="node"}'
        values: '999900+0x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: HostRebooted
        exp_alerts:
          - exp_labels:
              severity: info
              instance: xps.fritz.box:9100
              job: node
            exp_annotations:
              summary: "xps.fritz.box:9100 rebooted"
              description: "Uptime is under five minutes. A server that reboots on its own is worth knowing about."
      # Once uptime has passed five minutes, HostRebooted must go silent.
      - eval_time: 10m
        alertname: HostRebooted
        exp_alerts: []
