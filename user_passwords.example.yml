# Telegram bot. Alertmanager delivers alerts through it, and the inbound bot
# service polls it for /status, /backup_now and /restart.
# Create the bot with @BotFather; chat id is your own Telegram user id.
telegram_bot_token: ""
telegram_chat_id: ""

# Healthchecks.io ping URL for the Watchdog dead-man's-switch.
heartbeat_ping_url: ""

# The Authelia account password, hashed with the same filter the daniel user
# uses. Leave both blank and the role generates a random password on first run,
# writing it to /mnt/storage/config/authelia/secrets/initial_password.txt for
# you to read once. Every other Authelia secret is generated on the host and
# never appears here.
authelia_password: ""
authelia_password_salt: ""

# Single-use key for registering this host on the tailnet, so SSH can be
# reached remotely without a port forward. Generate one under
# https://login.tailscale.com/admin/settings/keys. Only needed until the host
# has joined -- after that it holds its own node key, and this can go back to
# being blank.
tailscale_auth_key: ""

# Passphrase for the FRITZ!Box wireless network. Both the 2.4GHz and 5GHz
# profiles use it. Without this the wifi profiles are left unmanaged and
# the host keeps whatever is already on disk.
wifi_psk: ""
