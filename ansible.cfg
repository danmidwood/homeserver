[defaults]
roles_path = ./roles

# Run handlers even when the play fails. Without this a run that fails partway
# leaves every notified handler unrun, and the next run does not re-notify them
# because the files they watch are already correct -- so a config lands on disk
# and the reload that would apply it never happens, while every subsequent run
# reports success. A rules file sat unloaded in Prometheus that way.
force_handlers = True
