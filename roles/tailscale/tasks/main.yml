- name: Install Tailscale
  # A host package: tailscaled needs /dev/net/tun, NET_ADMIN and the host's
  # routing table, and this is the remote access path, so it must not depend
  # on Docker being healthy.
  ansible.builtin.package:
    name: tailscale
    state: present

- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read the current Tailscale state
  # `tailscale status` exits non-zero when the node is logged out, which is a
  # normal state here, so BackendState decides instead of the return code.
  # check_mode: false because a --check run still needs its output.
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Decide whether this node is already on the tailnet
  # The length test guards the parse: Jinja's `and` short-circuits, so
  # from_json is never reached when the command produced nothing.
  ansible.builtin.set_fact:
    tailscale_connected: >-
      {{ (tailscale_status.stdout | default('') | trim | length > 0)
         and ((tailscale_status.stdout | from_json).BackendState | default('') == 'Running') }}

- name: Report when Tailscale has no way to authenticate
  # An auth key is a single-use bootstrap credential: once registered this host
  # holds its own node key, so a blank key and a connected node is the expected
  # steady state.
  when: not tailscale_connected and (tailscale_auth_key | default('') | length == 0)
  ansible.builtin.debug:
    msg: >-
      This host is not on the tailnet and tailscale_auth_key is empty in
      user_passwords.yml. Generate a key at
      https://login.tailscale.com/admin/settings/keys and set it, then run
      the playbook again.

- name: Join the tailnet
  # --accept-dns=false leaves /etc/resolv.conf to NetworkManager, which points
  # at the FRITZ!Box and is what resolves .fritz.box names.
  #
  # no_log because the auth key grants the right to add machines to the
  # tailnet.
  when: not tailscale_connected and (tailscale_auth_key | default('') | length > 0)
  ansible.builtin.command:
    argv:
      - tailscale
      - up
      - "--auth-key={{ tailscale_auth_key }}"
      - "--hostname={{ tailscale_hostname }}"
      - "--accept-dns=false"
  no_log: true
