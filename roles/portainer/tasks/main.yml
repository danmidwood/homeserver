- name: Pull Portainer image
  community.docker.docker_image_pull:
    name: "portainer/portainer-ce:2.44.0@sha256:f49255cd9378827fadfde46062ad0395050237c51d03a93a3dc1dbc6050dda3e"
    pull: not_present

- name: Create Portainer volume
  community.docker.docker_volume:
    name: portainer_data

- name: Run Portainer container
  community.docker.docker_container:
    name: portainer
    image: "portainer/portainer-ce:2.44.0@sha256:f49255cd9378827fadfde46062ad0395050237c51d03a93a3dc1dbc6050dda3e"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    # Every other container here sets this; portainer was the one that did
    # not, and it was the one service that failed to come back after the
    # 25 Aug 2026 reboot. Without it Docker leaves a stopped container
    # stopped, so the miss is invisible until something asks for it --
    # ContainerMissing fired, eight hours late, because the alert depends on
    # the monitoring stack that was down for the same reboot.
    restart_policy: always
    ports:
      - "8000:8000"
      - "9000:9000"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
