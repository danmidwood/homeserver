- name: Install Daniel's dependencies
  package:
    name:
      - git
      - openssh
      - sudo
      - zsh
    state: present

- name: Ensure user is present
  ansible.builtin.user:
    name: daniel
    groups: wheel
    append: true
    shell: /bin/zsh
    state: present
    password: "{{ daniel_password | password_hash('sha512', daniel_password_salt) }}"

- name: Ensure wheel group is in the sudoers list
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: '^# %wheel ALL=(ALL) ALL'
    line: '%wheel ALL=(ALL) ALL'
    state: present
    validate: 'visudo -cf %s'

- name: Add user to sudoers with no password requirement
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    state: present
    regexp: '^daniel '
    line: 'daniel ALL=(ALL) NOPASSWD:ALL'
    validate: 'visudo -cf %s'

- name: Clone Oh My Zsh repository
  git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: /home/daniel/.oh-my-zsh
    version: master
    force: yes
    update: yes
    accept_hostkey: yes
  become_user: daniel

- name: Copy the default .zshrc template for Oh My Zsh
  copy:
    src: /home/daniel/.oh-my-zsh/templates/zshrc.zsh-template
    dest: /home/daniel/.zshrc
    remote_src: yes
    force: no
    owner: daniel
    group: daniel
    mode: '0644'

- name: Set Oh My Zsh theme to xiong-chiamiov-plus
  lineinfile:
    path: /home/daniel/.zshrc
    owner: daniel
    group: daniel
    mode: '0644'
    line: 'ZSH_THEME=xiong-chiamiov-plus'
    regexp: '^ZSH_THEME='

- name: Ensure .ssh directory exists
  ansible.builtin.file:
    path: /home/daniel/.ssh
    state: directory
    owner: daniel
    group: daniel
    mode: '0700'

- name: Add work macbook public key to authorized_keys
  ansible.posix.authorized_key:
    user: daniel
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH3z/AM35YYthOkWQIXgJzqByoTI3u2W9H0J23ytEQBN daniel@work-mbp"

- name: Add the rebuilt laptop's public key to authorized_keys
  ansible.posix.authorized_key:
    user: daniel
    key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJpN9AsbvMQxup+O2aniMcCCAc7PzSY2KW3+I9IV6OMC dan@danmidwood.com"

- name: Configure git user name
  community.general.git_config:
    name: user.name
    scope: global
    value: "Daniel Midwood"
  become_user: daniel

- name: Configure git user email
  community.general.git_config:
    name: user.email
    scope: global
    value: "dan@danmidwood.com"
  become_user: daniel

- name: Generate a deploy key for pushing this repo to GitHub
  ansible.builtin.command:
    cmd: ssh-keygen -t ed25519 -f /home/daniel/.ssh/id_ed25519_github -N "" -C "daniel@xps"
    creates: /home/daniel/.ssh/id_ed25519_github
  become_user: daniel

- name: Ensure github.com uses the deploy key
  ansible.builtin.blockinfile:
    path: /home/daniel/.ssh/config
    create: true
    owner: daniel
    group: daniel
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED BLOCK - github.com"
    block: |
      Host github.com
        IdentityFile /home/daniel/.ssh/id_ed25519_github
        IdentitiesOnly yes

