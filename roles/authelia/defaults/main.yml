# Pinned exactly as every other image in this repository: a version tag for
# imagewatch to compare against, and a digest so the reference cannot move.
authelia_image: "authelia/authelia:4.39.20@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b"

authelia_config_dir: /mnt/storage/config/authelia

# The parent of every application's subdomain. The session cookie is scoped
# here, and that scope is what makes one login work across all of them.
authelia_cookie_domain: home.danmidwood.com
authelia_url: "https://auth.home.danmidwood.com"

# The address every application uses to recognise an incoming OIDC login as an
# existing account. This is not a contact address and changing it is not
# cosmetic: Planka, Immich and Grafana all match on email, so an address that
# differs from the one already on those accounts creates a second, empty
# account instead of signing into the existing one. It matches the Planka admin
# account declared in the planka role.
authelia_user_email: danieljamesmidwood@gmail.com

# Every application that authenticates against Authelia, with the callback its
# OIDC library expects. Adding one here generates its client secret on the next
# run and adds it to Authelia's configuration; wiring the application's own end
# is separate, and for Kavita is done by hand in its web interface.
#
# token_endpoint_auth_method, response_modes, require_pkce and scopes vary per
# client, and Authelia rejects a request whose form does not match the
# registration. Defaults are client_secret_basic, form_post and query, no PKCE
# requirement, and openid/profile/email/groups.
authelia_clients:
  - id: grafana
    name: Grafana
    redirect_uris:
      - https://grafana.home.danmidwood.com/login/generic_oauth
    # Grafana is configured with GF_AUTH_GENERIC_OAUTH_USE_PKCE, so it always
    # sends a verifier.
    require_pkce: true
  - id: planka
    name: Planka
    redirect_uris:
      - https://projectboard.home.danmidwood.com/oidc-callback
    # Planka asks for the authorization response in the URL fragment.
    response_modes:
      - form_post
      - query
      - fragment
  - id: actualbudget
    name: Actual Budget
    redirect_uris:
      - https://budget.home.danmidwood.com/openid/callback
  - id: immich
    name: Immich
    # The web client, the mobile application's deep link, and the desktop
    # application's loopback listener.
    redirect_uris:
      - https://photos.home.danmidwood.com/auth/login
      - https://photos.home.danmidwood.com/user-settings
      - app.immich:///oauth-callback
    # Immich puts its credentials in the request body.
    token_endpoint_auth_method: client_secret_post
  - id: kavita
    name: Kavita
    # ASP.NET Core's convention. The sign-out callback is listed so logging out
    # lands somewhere valid.
    redirect_uris:
      - https://books.home.danmidwood.com/signin-oidc
      - https://books.home.danmidwood.com/signout-callback-oidc
    # Kavita puts its credentials in the request body. It also uses pushed
    # authorization requests, so it validates these at the authorization
    # endpoint, before the login page.
    token_endpoint_auth_method: client_secret_post
    # Kavita requests offline_access, which asks for a refresh token.
    scopes:
      - openid
      - profile
      - email
      - groups
      - offline_access
