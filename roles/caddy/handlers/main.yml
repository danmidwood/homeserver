- name: Reload Caddy
  # `caddy reload` validates the new config before applying it and keeps the
  # running config if it is invalid, so a typo costs nothing. A restart would
  # fail to start on a bad config and take every service behind Caddy offline.
  ansible.builtin.command:
    cmd: docker exec caddy caddy reload --config /etc/caddy/Caddyfile
  changed_when: true
