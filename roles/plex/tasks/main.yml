- name: Pull the Plex Docker image
  community.docker.docker_image_pull:
    name: "plexinc/pms-docker:1.43.3.10896-cb3ebc72d@sha256:83a425ae9e133b1cb2cc3b809556e01c61cd8ff65c582e41b4374bc2210bac9e"
    pull: not_present

- name: Run Plex container
  community.docker.docker_container:
    name: "plex"
    image: "plexinc/pms-docker:1.43.3.10896-cb3ebc72d@sha256:83a425ae9e133b1cb2cc3b809556e01c61cd8ff65c582e41b4374bc2210bac9e"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    ports:
      - "32400:32400"
      - "3005:3005"
      - "8324:8324"
      - "32469:32469"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    volumes:
      - /mnt/storage/config/plex:/config
      - /mnt/tmdas/video:/data
    networks:
      - name: caddy_network
    env:
      PLEX_CLAIM: claim-sLM9Es5f6-xLU-sdubWs # Replace this one new system init
      # Plex's scheduled maintenance window is set in whole hours against the
      # server's own clock, and its logs are timestamped the same way. Without
      # this the container runs in UTC, so the window lands an hour later than
      # it reads through British Summer Time and moves again when that ends.
      TZ: "Europe/London"
