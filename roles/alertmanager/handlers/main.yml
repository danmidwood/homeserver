- name: Reload Alertmanager
  # A restart would discard in-flight notification grouping and repeat timers,
  # re-sending or delaying an alert.
  #
  # On SIGHUP with a bad config Alertmanager keeps the old one and only logs,
  # so without the check this would report success while changing nothing.
  ansible.builtin.shell: |
    set -e
    docker exec alertmanager amtool check-config /etc/alertmanager/conf/alertmanager.yml
    docker kill -s HUP alertmanager
  args:
    executable: /bin/bash
  changed_when: true
