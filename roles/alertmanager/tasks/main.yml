- name: Ensure Telegram and heartbeat credentials are configured
  ansible.builtin.assert:
    that:
      - telegram_bot_token | default('') | length > 0
      - telegram_chat_id | default('') | length > 0
      - heartbeat_ping_url | default('') | length > 0
    fail_msg: "telegram_bot_token, telegram_chat_id and heartbeat_ping_url must all be set in user_passwords.yml"

- name: Create Alertmanager config directory
  ansible.builtin.file:
    path: /mnt/storage/config/alertmanager
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Alertmanager data directory
  ansible.builtin.file:
    path: /mnt/storage/config/alertmanager/data
    state: directory
    # Upstream image runs as uid 65534 (nobody); it must own its silence
    # and notification-log state or it fails to start.
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Create the bind-mounted Alertmanager conf directory
  # The DIRECTORY is bind-mounted, not the files. A single-file bind mount
  # pins Docker to one inode, and copy:/template: write atomically via a
  # rename that orphans it, leaving the container reading a file the host no
  # longer has — which an in-place reload would re-read as though current.
  # `data` is kept out of it so the silence and notification log are not
  # exposed under a second path.
  ansible.builtin.file:
    path: /mnt/storage/config/alertmanager/conf
    state: directory
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Write the Telegram bot token
  ansible.builtin.copy:
    content: "{{ telegram_bot_token }}"
    dest: /mnt/storage/config/alertmanager/conf/telegram_token
    owner: '65534'
    group: '65534'
    mode: '0600'
  no_log: true
  notify: Reload Alertmanager

- name: Template Alertmanager configuration
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /mnt/storage/config/alertmanager/conf/alertmanager.yml
    owner: '65534'
    group: '65534'
    mode: '0640'
  # The rendered file carries telegram_chat_id and the Healthchecks ping
  # URL, which is itself a bearer credential. Without this they appear in
  # --diff and -v output. The cost is that a failure to render this
  # template reports without detail; the token file beside it is already
  # protected the same way.
  no_log: true
  notify: Reload Alertmanager

- name: Pull the Alertmanager image
  community.docker.docker_image_pull:
    name: "prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d"
    pull: not_present

- name: Run Alertmanager container
  community.docker.docker_container:
    name: alertmanager
    image: "prom/alertmanager:v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    ports:
      # Loopback only, and this one matters most: Alertmanager's API accepts
      # silences with no authentication whatsoever. On 0.0.0.0 anyone on the
      # LAN could mute every alert on this host indefinitely, and nothing would
      # report that it had happened. The host scripts that push alerts
      # (backup-alert, image-update-check, restic-restore-check) and the
      # Telegram bot all use localhost, so none of them notice the change.
      - "127.0.0.1:9093:9093"
    volumes:
      - /mnt/storage/config/alertmanager/conf:/etc/alertmanager/conf:ro
      - /mnt/storage/config/alertmanager/data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/conf/alertmanager.yml"
      - "--storage.path=/alertmanager"

- name: Remove the superseded single-file Alertmanager config and token
  # Predecessors of the files now in conf/. The token copy matters most:
  # a stale bot credential left readable on disk is worse than untidy.
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /mnt/storage/config/alertmanager/alertmanager.yml
    - /mnt/storage/config/alertmanager/telegram_token

- name: Read the silences Alertmanager already holds
  ansible.builtin.uri:
    url: http://localhost:9093/api/v2/silences
    return_content: true
  register: alertmanager_existing_silences
  changed_when: false
  check_mode: false

- name: Silence the update alert for containers pinned on purpose
  # Matched on container AND current_tag together, so the silence covers only
  # the version being held. Alertmanager has no upsert, so an equivalent
  # active silence is looked for first; without that check every run would
  # create another copy.
  ansible.builtin.uri:
    url: http://localhost:9093/api/v2/silences
    method: POST
    body_format: json
    status_code: 200
    body:
      matchers:
        - name: alertname
          value: ImageUpdateAvailable
          isRegex: false
          isEqual: true
        - name: container
          value: "{{ item.container }}"
          isRegex: false
          isEqual: true
        - name: current_tag
          value: "{{ item.current_tag }}"
          isRegex: false
          isEqual: true
      # Both in UTC, which the trailing Z claims. strftime renders local time
      # unless told otherwise, and an hour of British Summer Time was enough to
      # leave the silence pending, suppressing nothing.
      startsAt: "{{ ansible_date_time.iso8601 }}"
      endsAt: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime((ansible_date_time.epoch | int) + (alertmanager_silence_duration_days | int * 86400), utc=true) }}"
      createdBy: ansible
      comment: "{{ item.comment | trim }}"
  loop: "{{ alertmanager_pinned_silences }}"
  loop_control:
    label: "{{ item.container }} @ {{ item.current_tag }}"
  when: >-
    (alertmanager_existing_silences.content | from_json
      | rejectattr('status.state', 'equalto', 'expired')
      | selectattr('matchers', 'contains', {'name': 'container', 'value': item.container, 'isRegex': false, 'isEqual': true})
      | selectattr('matchers', 'contains', {'name': 'current_tag', 'value': item.current_tag, 'isRegex': false, 'isEqual': true})
      | list | length) == 0
