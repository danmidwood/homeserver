- name: Check whether the packaged Prometheus unit is present
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/prometheus.service
  register: packaged_prometheus_unit

- name: Stop and disable the packaged Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: stopped
    enabled: false
  when: packaged_prometheus_unit.stat.exists

- name: Remove the packaged Prometheus
  # Replaced by a digest-pinned container; a rolling-release package would
  # move underneath us on every pacman -Syu.
  community.general.pacman:
    name: prometheus
    state: absent

- name: Remove the packaged Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: absent

- name: Remove the packaged Prometheus data directory
  # pacman leaves this behind on removal along with the orphaned `prometheus`
  # system user; the brief calls for the package and its data to go, and this
  # is the package's other conventional data directory (the user is left
  # alone deliberately, per pacman convention).
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: absent

- name: Ensure node-exporter, smartmontools and jq are installed
  # smartmontools provides smartctl, which the SMART collector runs.
  # jq parses its JSON output. Also declared by the backup role, which
  # genuinely needs it too; pacman makes installing it from both idempotent,
  # and a role-limited run (or ever dropping the backup role) must not leave
  # the collector broken behind smart-metrics.sh's `command not found`.
  ansible.builtin.package:
    name:
      - prometheus-node-exporter
      - smartmontools
      - jq
    state: present

- name: Create the node-exporter textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enable the node-exporter textfile and systemd collectors
  ansible.builtin.copy:
    content: |
      # The systemd collector reports each unit's state, which is how oneshot
      # units and background services on this host are monitored. Nothing has
      # to expose a port or cooperate: a service that is wedged but still
      # accepting connections would pass an HTTP scrape while failing this
      # check.
      #
      # unit-include is deliberately narrow. Without it the collector exports a
      # series per unit on the host, which is hundreds of series carrying no
      # information anyone will ever alert on.
      # Bound to the docker0 gateway rather than every interface. Prometheus
      # runs in a container and reaches the host as host.docker.internal, which
      # resolves to exactly this address, so the only legitimate consumer is
      # unaffected — and the host can still curl it, since the host owns the
      # address. On 0.0.0.0 it offered the LAN an unauthenticated read of ~2500
      # metrics describing this machine.
      #
      # If docker0 ever changed subnet, node-exporter would fail to bind and
      # the unit would fail loudly, and TargetDown would fire within ten
      # minutes. That is the right failure direction for a change like this.
      NODE_EXPORTER_ARGS="--web.listen-address=172.17.0.1:9100 --collector.textfile.directory=/var/lib/node_exporter/textfile_collector --collector.systemd --collector.systemd.unit-include=(telegram-bot|restic-backup|restic-restore-check|backup-alert|image-update-check|docker)\\.(service|timer)"
    dest: /etc/conf.d/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart node-exporter

- name: Create the node-exporter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/prometheus-node-exporter.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the expected-container list for ContainerMissing
  ansible.builtin.template:
    src: container_expected.prom.j2
    dest: /var/lib/node_exporter/textfile_collector/container_expected.prom
    owner: root
    group: root
    mode: '0644'

- name: Make node-exporter wait for the docker bridge it binds to
  # node-exporter binds to the docker0 gateway address (see the args above).
  # That address does not exist until Docker creates the bridge, but the
  # packaged unit orders itself only after network-online.target. On a cold
  # boot the exporter therefore starts first, fails with "cannot assign
  # requested address", burns its default start limit of five attempts in
  # about twenty milliseconds, and stays dead. Everything downstream goes
  # blind with it: node_load1, the filesystem metrics and every textfile
  # metric (backup age, SMART, power, pacman, restore drill,
  # container_expected).
  #
  # The comment on the listen address argues that a bad address should fail
  # loudly, and it still does -- but only once these retries are exhausted.
  # A transient boot race is a different thing from a wrong address, and it
  # should not be latched into a permanent failure.
  #
  # This is a drop-in rather than an edit to the unit: the unit is owned by
  # the package and a pacman upgrade would overwrite it.
  ansible.builtin.copy:
    content: |
      # Managed by Ansible. Do not edit on the host.
      [Unit]
      After=docker.service
      Wants=docker.service
      StartLimitIntervalSec=300
      StartLimitBurst=20

      [Service]
      RestartSec=5
    dest: /etc/systemd/system/prometheus-node-exporter.service.d/wait-for-docker.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart node-exporter

- name: Start and enable node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Install the pacman staleness collector
  ansible.builtin.copy:
    src: pacman-metrics.sh
    dest: /usr/local/bin/pacman-metrics.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the pacman collector unit
  ansible.builtin.copy:
    src: pacman-metrics.service
    dest: /etc/systemd/system/pacman-metrics.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Install the pacman collector timer
  ansible.builtin.copy:
    src: pacman-metrics.timer
    dest: /etc/systemd/system/pacman-metrics.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Template the SMART collector
  ansible.builtin.template:
    src: smart-metrics.sh.j2
    dest: /usr/local/bin/smart-metrics.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the SMART collector unit
  ansible.builtin.copy:
    src: smart-metrics.service
    dest: /etc/systemd/system/smart-metrics.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Install the SMART collector timer
  ansible.builtin.copy:
    src: smart-metrics.timer
    dest: /etc/systemd/system/smart-metrics.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Flush handlers so systemd sees the new units before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the pacman staleness timer
  ansible.builtin.systemd:
    name: pacman-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start the SMART collector timer
  ansible.builtin.systemd:
    name: smart-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create Prometheus config directory
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/rules
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Prometheus data directory
  ansible.builtin.file:
    # On local disk deliberately: Docker named volumes are bind-mounted to
    # the external array, and Prometheus writes continuously.
    path: /mnt/storage/config/prometheus/data
    state: directory
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Create the bind-mounted Prometheus conf directory
  # The config lives in its own directory because the DIRECTORY is what gets
  # bind-mounted. A single-file bind mount pins Docker to one inode, and
  # template: writes atomically via a rename that orphans it — the container
  # would go on reading a file the host no longer has, and an in-place reload
  # would faithfully re-read the stale copy. `data` is kept out of this
  # directory so the TSDB is not exposed under a second path.
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /mnt/storage/config/prometheus/conf/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Reload Prometheus

- name: Discover the current set of Prometheus rule files in the repo
  ansible.builtin.set_fact:
    prometheus_rule_basenames: "{{ query('fileglob', role_path + '/files/rules/*.yml') | map('basename') | list }}"

- name: Copy Prometheus alert rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/mnt/storage/config/prometheus/rules/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - "rules/*.yml"
  notify: Reload Prometheus

- name: Find rule files currently deployed on the server
  ansible.builtin.find:
    paths: /mnt/storage/config/prometheus/rules
    patterns: "*.yml"
  register: prometheus_deployed_rules

- name: Remove stale Prometheus rule files
  # A rule file renamed or deleted from the repo must not linger here: Prometheus
  # would keep loading and evaluating it forever, firing alerts for a rule that
  # no longer exists in version control, with nothing to signal the drift.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ prometheus_deployed_rules.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in prometheus_rule_basenames
  notify: Reload Prometheus

- name: Pull the Prometheus image
  community.docker.docker_image_pull:
    name: "prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0"
    pull: not_present

- name: Run Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: "prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    ports:
      # Loopback only. Prometheus has no authentication, and everything that
      # legitimately reaches it does so either from the host (the Telegram bot
      # reads localhost:9090) or over the container network (Grafana uses
      # prometheus:9090). Publishing on 0.0.0.0 only ever offered the LAN a
      # read of every metric about this machine.
      - "127.0.0.1:9090:9090"
    etc_hosts:
      host.docker.internal: host-gateway
    volumes:
      - /mnt/storage/config/prometheus/conf:/etc/prometheus/conf:ro
      - /mnt/storage/config/prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/storage/config/prometheus/data:/prometheus
    command:
      # --web.enable-lifecycle is deliberately omitted: the container publishes
      # 9090 on 0.0.0.0 unauthenticated and is not behind Caddy, so that flag
      # would expose POST /-/reload and POST /-/quit to anyone on the LAN, who
      # could shut Prometheus down. Config/rule reloads use `docker kill -s HUP
      # prometheus` instead, which reloads identically with no network endpoint.
      - "--config.file=/etc/prometheus/conf/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

- name: Remove the superseded single-file Prometheus config
  # Predecessor of conf/prometheus.yml. No longer mounted anywhere, but it
  # still looks like the live config to anyone who goes looking.
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/prometheus.yml
    state: absent
