- name: Check whether the packaged Prometheus unit is present
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/prometheus.service
  register: packaged_prometheus_unit

- name: Stop and disable the packaged Prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: stopped
    enabled: false
  when: packaged_prometheus_unit.stat.exists

- name: Remove the packaged Prometheus
  # Replaced by a digest-pinned container; a rolling-release package would
  # move underneath us on every pacman -Syu.
  community.general.pacman:
    name: prometheus
    state: absent

- name: Remove the packaged Prometheus configuration directory
  ansible.builtin.file:
    path: /etc/prometheus
    state: absent

- name: Remove the packaged Prometheus data directory
  # pacman leaves this behind on removal along with the orphaned `prometheus`
  # system user; the brief calls for the package and its data to go, and this
  # is the package's other conventional data directory (the user is left
  # alone deliberately, per pacman convention).
  ansible.builtin.file:
    path: /var/lib/prometheus
    state: absent

- name: Ensure node-exporter, smartmontools and jq are installed
  # smartmontools provides smartctl, which the SMART collector runs.
  # jq parses its JSON output. Also declared by the backup role, which
  # genuinely needs it too; pacman makes installing it from both idempotent,
  # and a role-limited run (or ever dropping the backup role) must not leave
  # the collector broken behind smart-metrics.sh's `command not found`.
  ansible.builtin.package:
    name:
      - prometheus-node-exporter
      - smartmontools
      - jq
    state: present

- name: Create the node-exporter textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Enable the node-exporter textfile collector
  ansible.builtin.copy:
    content: |
      NODE_EXPORTER_ARGS="--collector.textfile.directory=/var/lib/node_exporter/textfile_collector"
    dest: /etc/conf.d/prometheus-node-exporter
    owner: root
    group: root
    mode: '0644'
  notify: Restart node-exporter

- name: Write the expected-container list for ContainerMissing
  ansible.builtin.template:
    src: container_expected.prom.j2
    dest: /var/lib/node_exporter/textfile_collector/container_expected.prom
    owner: root
    group: root
    mode: '0644'

- name: Start and enable node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Template the SMART collector
  ansible.builtin.template:
    src: smart-metrics.sh.j2
    dest: /usr/local/bin/smart-metrics.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the SMART collector unit
  ansible.builtin.copy:
    src: smart-metrics.service
    dest: /etc/systemd/system/smart-metrics.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Install the SMART collector timer
  ansible.builtin.copy:
    src: smart-metrics.timer
    dest: /etc/systemd/system/smart-metrics.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd for SMART collector

- name: Flush handlers so systemd sees the new units before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Enable and start the SMART collector timer
  ansible.builtin.systemd:
    name: smart-metrics.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Create Prometheus config directory
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/rules
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Prometheus data directory
  ansible.builtin.file:
    # On local disk deliberately: Docker named volumes are bind-mounted to
    # the external array, and Prometheus writes continuously.
    path: /mnt/storage/config/prometheus/data
    state: directory
    owner: '65534'
    group: '65534'
    mode: '0755'

- name: Create the bind-mounted Prometheus conf directory
  # The config lives in its own directory because the DIRECTORY is what gets
  # bind-mounted. A single-file bind mount pins Docker to one inode, and
  # template: writes atomically via a rename that orphans it — the container
  # would go on reading a file the host no longer has, and an in-place reload
  # would faithfully re-read the stale copy. `data` is kept out of this
  # directory so the TSDB is not exposed under a second path.
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /mnt/storage/config/prometheus/conf/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Reload Prometheus

- name: Discover the current set of Prometheus rule files in the repo
  ansible.builtin.set_fact:
    prometheus_rule_basenames: "{{ query('fileglob', role_path + '/files/rules/*.yml') | map('basename') | list }}"

- name: Copy Prometheus alert rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/mnt/storage/config/prometheus/rules/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - "rules/*.yml"
  notify: Reload Prometheus

- name: Find rule files currently deployed on the server
  ansible.builtin.find:
    paths: /mnt/storage/config/prometheus/rules
    patterns: "*.yml"
  register: prometheus_deployed_rules

- name: Remove stale Prometheus rule files
  # A rule file renamed or deleted from the repo must not linger here: Prometheus
  # would keep loading and evaluating it forever, firing alerts for a rule that
  # no longer exists in version control, with nothing to signal the drift.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ prometheus_deployed_rules.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in prometheus_rule_basenames
  notify: Reload Prometheus

- name: Pull the Prometheus image
  community.docker.docker_image_pull:
    name: "prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0"
    pull: not_present

- name: Run Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: "prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    ports:
      - "9090:9090"
    etc_hosts:
      host.docker.internal: host-gateway
    volumes:
      - /mnt/storage/config/prometheus/conf:/etc/prometheus/conf:ro
      - /mnt/storage/config/prometheus/rules:/etc/prometheus/rules:ro
      - /mnt/storage/config/prometheus/data:/prometheus
    command:
      # --web.enable-lifecycle is deliberately omitted: the container publishes
      # 9090 on 0.0.0.0 unauthenticated and is not behind Caddy, so that flag
      # would expose POST /-/reload and POST /-/quit to anyone on the LAN, who
      # could shut Prometheus down. Config/rule reloads use `docker kill -s HUP
      # prometheus` instead, which reloads identically with no network endpoint.
      - "--config.file=/etc/prometheus/conf/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

- name: Remove the superseded single-file Prometheus config
  # Predecessor of conf/prometheus.yml. No longer mounted anywhere, but it
  # still looks like the live config to anyone who goes looking.
  ansible.builtin.file:
    path: /mnt/storage/config/prometheus/prometheus.yml
    state: absent
