- name: Reload Prometheus
  # A restart would punch a gap in every graph and replay the WAL for a change
  # that only touched config or rules.
  #
  # On SIGHUP with a bad config Prometheus logs the error and keeps running the
  # old one, so without promtool this would report success for a change that
  # never took effect.
  #
  # `--web.enable-lifecycle` is deliberately omitted from the container, so
  # SIGHUP is the reload mechanism; there is no HTTP reload endpoint to
  # expose on the LAN.
  ansible.builtin.shell: |
    set -e
    docker exec prometheus promtool check config /etc/prometheus/conf/prometheus.yml
    docker kill -s HUP prometheus
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart node-exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    state: restarted

- name: Reload systemd for SMART collector
  ansible.builtin.systemd:
    daemon_reload: true
