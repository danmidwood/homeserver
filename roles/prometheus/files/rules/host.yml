groups:
  - name: host
    rules:
      - alert: DiskSpaceCritical
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!="/mnt/seagate"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!="/mnt/seagate"}
            < 0.05
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} has under 5% free"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }} free."

      - alert: FilesystemReadOnly
        expr: node_filesystem_readonly{fstype!~"tmpfs|ramfs|overlay|squashfs"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} has gone read-only"
          description: "A filesystem remounting itself read-only is usually the first visible sign of a failing disk. Check dmesg on {{ $labels.instance }}."

      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!="/mnt/seagate",mountpoint!="/var"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!="/mnt/seagate",mountpoint!="/var"}
            < 0.15
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} has under 15% free"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }} free."

      - alert: VarSpaceCritical
        expr: |
          node_filesystem_avail_bytes{mountpoint="/var"}
            / node_filesystem_size_bytes{mountpoint="/var"}
            < 0.15
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} has under 15% free"
          description: "{{ $labels.mountpoint }} on {{ $labels.instance }} is at {{ $value | humanizePercentage }} free. A full /var stops Docker and journald writing, which takes the services down."

      - alert: DiskWillFillSoon
        expr: |
          predict_linear(
            node_filesystem_avail_bytes{fstype!~"tmpfs|ramfs|overlay|squashfs",mountpoint!="/mnt/seagate"}[6h],
            4 * 24 * 3600
          ) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} is projected to fill within 4 days"
          description: "Based on the last 6 hours of usage, {{ $labels.mountpoint }} on {{ $labels.instance }} runs out of space within 4 days."

      - alert: MemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Under 10% memory available"
          description: "{{ $labels.instance }} has {{ $value | humanizePercentage }} of memory available."

      - alert: CPUThermalThrottle
        # platform_coretemp_0 exposes three sensors on this chip: temp1
        # (the package) and temp2/temp3 (the two cores), all reading within
        # a degree or two of each other. Without the sensor filter, one
        # thermal event fires three near-identical alerts. temp1 is what
        # governs throttling — it is the package reading, derived from the
        # cores — so the per-core sensors add nothing actionable on a
        # two-core CPU and are excluded.
        expr: node_hwmon_temp_celsius{chip="platform_coretemp_0",sensor="temp1"} > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU running at {{ $value }}C"
          description: "The server is a laptop; sustained high temperature suggests blocked airflow or a failing fan."

      - alert: HostRebooted
        expr: (node_time_seconds - node_boot_time_seconds) < 300
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.instance }} rebooted"
          description: "Uptime is under five minutes. A server that reboots on its own is worth knowing about."

      - alert: TargetDown
        expr: up == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} target {{ $labels.instance }} is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for over 10 minutes. Every other rule that depends on metrics from this target has stopped evaluating and gone silent as a result — that silence does not mean things are healthy, it means nothing is being checked."

      - alert: ClockNotSynchronised
        # Not a cosmetic complaint. BackupStale, SmartMetricsStale and
        # BackupTimestampInFuture all compare a recorded timestamp against
        # time(), so a clock that drifts or jumps can silence them while
        # every indicator stays green. This host ran for months with no NTP
        # at all and had drifted nearly nine minutes before anyone noticed,
        # which is also long enough to break Vaultwarden's TOTP codes.
        # 30m rather than something shorter: a brief resync gap after boot
        # is normal and must not page.
        expr: node_timex_sync_status == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has no time synchronisation"
          description: "The kernel reports the clock is not being disciplined by NTP, so it is free-running and will drift further the longer this lasts. Every alert that compares a timestamp against the current time can be silenced by a wrong clock. Check `timedatectl` and `systemctl status systemd-timesyncd`."

      - alert: TextfileCollectorError
        # node-exporter drops EVERY textfile metric when any one file fails
        # to parse, so a single malformed file blinds both the backup rules
        # and the SMART rules at once. This fires in 15 minutes; the
        # absence rules that would eventually notice take an hour.
        expr: node_textfile_scrape_error == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "node-exporter cannot read a textfile metric file"
          description: "A file in /var/lib/node_exporter/textfile_collector failed to parse, and node-exporter responds by dropping ALL textfile metrics — so the backup and SMART rules are currently evaluating nothing. Check that directory for a malformed or partially written .prom file."
