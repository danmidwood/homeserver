groups:
  - name: backup
    rules:
      # The offsite backup to Backblaze B2 is the reason this whole
      # monitoring stack exists. These four rules cover the ways it can let
      # you down: it failed, it stopped running, its own staleness check was
      # silently defeated by a bad clock, or it was never being watched in
      # the first place.

      - alert: BackupStale
        # 26 hours, not 24: the timer is OnCalendar=daily, so a run that
        # starts late or takes a while must not trip this.
        expr: time() - restic_backup_last_success_timestamp_seconds > 26 * 3600
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in over 26 hours"
          description: "The last successful restic backup to B2 finished {{ $value | humanizeDuration }} ago. The daily timer may have failed to run at all — check `systemctl list-timers restic-backup.timer` and `journalctl -u restic-backup.service`."

      - alert: BackupTimestampInFuture
        # If the recorded success timestamp is ever ahead of Prometheus's
        # clock, BackupStale's subtraction goes negative and stays negative
        # forever — the alert that exists to catch a stalled backup can
        # never fire again, and BackupMetricMissing stays quiet too because
        # the series is present. This is realistic here: END is the host's
        # wall clock, this is a 2016 laptop, and a boot with a dead RTC
        # before systemd-timesyncd corrects the time writes a far-future
        # value into a file that then persists across reboots. A dedicated
        # rule, rather than a second term in BackupStale's expression, keeps
        # each alert's annotation truthful about what it actually detected.
        expr: restic_backup_last_success_timestamp_seconds - time() > 3600
        labels:
          severity: critical
        annotations:
          summary: "Backup timestamp is in the future"
          description: "The last recorded restic backup success is {{ $value | humanizeDuration }} ahead of this server's clock. While this holds, BackupStale cannot fire and the backup is effectively unmonitored. The likely cause is the host's clock being wrong — check for a dead RTC battery and whether systemd-timesyncd has synced — not that the backup is somehow ahead of schedule."

      - alert: BackupMetricMissing
        # Not redundant with BackupStale. BackupStale compares a timestamp;
        # if the textfile was never written there is no timestamp to
        # compare and that rule silently never fires. absent() catches
        # exactly that — the case where the backup looks monitored and is
        # not. The 1h `for:` stops it firing during a Prometheus restart.
        expr: absent(restic_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Backup metrics are missing entirely"
          description: "node_exporter is not exporting restic_backup_last_success_timestamp_seconds, so BackupStale cannot fire and the backup is effectively unmonitored. Either no backup has succeeded since this was deployed, or the textfile collector is broken — check /var/lib/node_exporter/textfile_collector/restic_backup.prom exists and node_textfile_scrape_error is 0."

      # The drill runs weekly. Ten days allows a missed run plus its jitter
      # before complaining, so a single skipped week is noticed but a late one
      # is not.
      #
      # This is the rule that matters most in the whole file: everything else
      # here proves a backup RAN. Only this proves what it wrote can be read
      # back. A silent failure of the drill would leave the backups looking
      # perfect right up until the day they were needed.
      - alert: RestoreDrillStale
        expr: time() - restic_restore_last_success_timestamp_seconds > 10 * 24 * 3600
        # No `for:`, matching BackupStale. The condition is already a ten-day
        # window, so a holding period adds nothing -- and on a metric written
        # once a week, a `for:` cannot be satisfied at all: Prometheus's
        # five-minute lookback means the series does not exist for most of the
        # interval between samples.
        labels:
          severity: warning
        annotations:
          summary: "The backups have not been proven restorable for over 10 days"
          description: "restic-restore-check has not completed successfully in more than 10 days, so nothing currently confirms the backups can be read back. Run `systemctl start restic-restore-check` and check `journalctl -u restic-restore-check`."

      # The staleness rule above compares a timestamp; an absent timestamp has
      # nothing to compare and would silently never fire.
      - alert: RestoreDrillMetricMissing
        expr: absent(restic_restore_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No restore drill has ever succeeded"
          description: "restic_restore_last_success_timestamp_seconds does not exist, so RestoreDrillStale cannot fire and nothing is confirming the backups are restorable. Expected after first provisioning the host, until the first weekly drill runs."
