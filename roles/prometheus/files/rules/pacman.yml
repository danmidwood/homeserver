groups:
  - name: pacman
    rules:
      # The risk of an Arch system is entirely in the gap between upgrades, not
      # in the upgrade itself. Arch has no supported partial upgrade — packages
      # are built against whatever versions of their dependencies are current —
      # so the only choice is a full -Syu or nothing, and a rare one is far more
      # dangerous than a frequent one. A month's worth is a couple of dozen
      # packages; twenty months was 411, including the kernel, glibc, systemd
      # and the container runtime.
      #
      # 30 days: the gap is the risk, so a monthly prompt keeps each upgrade
      # small enough to read through in one sitting.
      - alert: SystemUpgradeOverdue
        expr: time() - pacman_last_full_upgrade_timestamp_seconds > 30 * 24 * 3600
        labels:
          severity: warning
        annotations:
          summary: "No full system upgrade in {{ $value | humanizeDuration }}"
          description: "The host has not had a `pacman -Syu` in over 30 days. Arch does not support partial upgrades, so the gap is the risk: installing any new package meanwhile builds it against libraries this system does not have. Run `ansible-playbook -i inventory/hosts.ini playbooks/upgrade.yml --check` to preview, and read https://archlinux.org/news/ first."

      # A timestamp of zero means the log carried no upgrade at all, which is
      # different from being overdue and would otherwise read as 1970.
      - alert: SystemUpgradeNeverRecorded
        expr: pacman_last_full_upgrade_timestamp_seconds == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No system upgrade has ever been recorded"
          description: "pacman's log contains no full system upgrade. Either the host has never been upgraded since installation, or the log has been rotated away. Check `grep 'full system upgrade' /var/log/pacman.log`."

      # Comparing a timestamp needs the timestamp to exist; an absent one has
      # nothing to compare and would silently never fire.
      - alert: PacmanMetricsMissing
        expr: absent(pacman_last_full_upgrade_timestamp_seconds)
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "No system upgrade metric is being reported"
          description: "pacman_last_full_upgrade_timestamp_seconds is absent, so SystemUpgradeOverdue cannot fire. Check `systemctl status pacman-metrics.timer` on the host."

      # Arch publishes a handful of items a year, and the ones that matter say a
      # step must be taken by hand before upgrading -- a keyring refresh, a
      # package replaced by another, a file that must be moved. Skipping one can
      # leave a system that does not boot, and this host is a laptop in an attic
      # with no remote console.
      #
      # Comparing against the last upgrade makes this mean "published since you
      # last upgraded", so it clears itself once the upgrade is done rather than
      # needing to be acknowledged.
      - alert: ArchNewsSinceLastUpgrade
        expr: arch_news_latest_timestamp_seconds > on() pacman_last_full_upgrade_timestamp_seconds
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Arch news published since the last upgrade: {{ $labels.title }}"
          description: "https://archlinux.org/news/ has an item newer than this host's last `pacman -Syu`. Read it before upgrading: the ones that matter require a manual step, and playbooks/upgrade.yml cannot infer them."

      # The feed being unreachable is not the same as there being no news, so
      # the collector leaves the previous file alone on failure. That means a
      # collector that has quietly stopped would read as "nothing published".
      - alert: ArchNewsCheckStale
        expr: time() - arch_news_check_timestamp_seconds > 3 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "The Arch news feed has not been read for {{ $value | humanizeDuration }}"
          description: "arch-news-metrics.timer has not completed a successful read in three days, so ArchNewsSinceLastUpgrade is unarmed and would stay silent through an item requiring manual intervention. Check `systemctl status arch-news-metrics.service`."
