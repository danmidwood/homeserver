# Explicit, not scanned. `smartctl --scan` on this host returns /dev/sda and
# /dev/nvme0 and misses /dev/sdb entirely — the 8TB array disk holding the
# photo library, which answers SMART only when told `-d sat`. Scanning would
# monitor the wrong disks and report healthy forever.
#
# Pinned by /dev/disk/by-id/ rather than kernel names (/dev/sdb,
# /dev/nvme0n1): kernel names are assigned in enumeration order at boot, and
# the array enclosure is USB-attached, so an unplug or a reboot can renumber
# it — a freed kernel name can be taken over by the enclosure, with
# something else taking /dev/sdb.
# smartctl would then succeed against the wrong disk: smart_collector_success
# stays 1, healthy metrics flow under the old device label, and the array
# disk that actually matters goes unmonitored with no alert at all. The
# model+serial by-id form is used rather than wwn-/eui. because it stays
# readable in a Telegram message and carries the serial number needed for a
# warranty claim.
#
# /dev/sda is omitted deliberately: its USB bridge rejects SMART commands.
smart_devices:
  - device: /dev/disk/by-id/ata-ST8000NT001-3LZ101_WRQ2Q8V2
    type: sat
  - device: /dev/disk/by-id/nvme-THNSN5512GPUK_NVMe_TOSHIBA_512GB_Z68S122GT1AT
    type: nvme

# The containers this host is configured to run. Written into the textfile
# collector as container_expected{name="..."} so ContainerMissing can compare
# what should be running against what cAdvisor actually reports.
#
# This is data rather than templated rule text deliberately: a templated rule
# file lives under templates/, where the test harness never looks and promtool
# cannot validate it. Adding a service to the playbook means adding a line
# here, which extends alert coverage automatically.
monitored_containers:
  - actual_budget
  - alertmanager
  # Six applications delegate their login to this one container. If it stops,
  # none of them can be signed into, so its absence matters more than any
  # single application's here.
  - authelia
  - blackbox
  - cadvisor
  - caddy
  - ftp_server
  - grafana
  - immich-machine-learning
  - immich-postgres
  - immich-redis
  - immich-server
  - kavita
  - planka
  - planka-postgres
  - plex
  - portainer
  - prometheus
  - vaultwarden

# The URLs blackbox probes, matching the Caddyfile's hostnames.
#
# plex is probed at /identity rather than /: its root returns 401 because it
# requires authentication, so a default probe would report it permanently
# down and EndpointDown would fire forever. /identity is unauthenticated and
# returns 200 with the server's machineIdentifier.
monitored_endpoints:
  # The login page every other endpoint here now depends on. It answers 200
  # unauthenticated, so it needs no special path the way plex does.
  - https://auth.home.danmidwood.com
  - https://books.home.danmidwood.com
  - https://budget.home.danmidwood.com
  - https://grafana.home.danmidwood.com
  - https://passwords.home.danmidwood.com
  - https://photos.home.danmidwood.com
  - https://plex.home.danmidwood.com/identity
  - https://projectboard.home.danmidwood.com
