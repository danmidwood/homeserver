- name: Create blackbox config directory
  ansible.builtin.file:
    path: /mnt/storage/config/blackbox
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the bind-mounted blackbox conf directory
  # The DIRECTORY is bind-mounted, not the file: a single-file bind mount
  # pins Docker to one inode that copy:'s atomic rename then orphans.
  ansible.builtin.file:
    path: /mnt/storage/config/blackbox/conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Write the blackbox probe module config
  ansible.builtin.copy:
    src: blackbox.yml
    dest: /mnt/storage/config/blackbox/conf/blackbox.yml
    owner: root
    group: root
    mode: '0644'
  notify: Reload blackbox

- name: Pull the blackbox exporter image
  community.docker.docker_image_pull:
    name: "prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc"
    pull: not_present

- name: Run blackbox exporter container
  community.docker.docker_container:
    name: blackbox
    image: "prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    volumes:
      - /mnt/storage/config/blackbox/conf:/etc/blackbox_exporter/conf:ro
    command:
      - "--config.file=/etc/blackbox_exporter/conf/blackbox.yml"

- name: Remove the superseded single-file blackbox config
  ansible.builtin.file:
    path: /mnt/storage/config/blackbox/blackbox.yml
    state: absent
