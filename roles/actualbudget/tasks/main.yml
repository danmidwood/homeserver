- name: Pull the Actual Budget Docker image
  community.docker.docker_image_pull:
    name: "actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5"
    pull: not_present

- name: Create Actual Budget data directory
  file:
    path: /mnt/storage/config/actual-budget/data
    state: directory
    owner: daniel
    group: daniel
    mode: '0755'


- name: Run Actual Budget container
  community.docker.docker_container:
    name: "actual_budget"
    image: "actualbudget/actual-server:26.8.1@sha256:6478d9ddfc0924479c09e6699c205e354c6f2216dfe7de3c0fb7b590d6edcdc5"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    volumes:
      - /mnt/storage/config/actual-budget/data:/data
    networks:
      - name: caddy_network
    env:
      # The discovery URL lets each endpoint be looked up rather than pinned.
      ACTUAL_OPENID_DISCOVERY_URL: "{{ authelia_url }}"
      ACTUAL_OPENID_CLIENT_ID: "actualbudget"
      ACTUAL_OPENID_CLIENT_SECRET: "{{ authelia_client_secret.actualbudget }}"
      ACTUAL_OPENID_SERVER_HOSTNAME: "https://budget.home.danmidwood.com"
      # Removes the server password as a login method, leaving Authelia. The
      # budget file's own encryption is separate and unaffected.
      ACTUAL_OPENID_ENFORCE: "true"
