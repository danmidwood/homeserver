# NetworkManager gives up reconnecting after four attempts by default, then
# waits for a human. After a power cut this host boots faster than the router,
# burns all four retries against an access point that is not up yet, and stays
# offline until someone reconnects it by hand -- which is exactly what happened
# after the last outage.
#
# 0 means retry forever.
[connection]
connection.autoconnect-retries=0
