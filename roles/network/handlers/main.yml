- name: Reload NetworkManager
  # Restarting NetworkManager over a wifi connection drops the link this
  # playbook is running across.
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded

- name: Reload NetworkManager connections
  # The SIGHUP sent by the reload above re-reads NetworkManager.conf but leaves
  # the connection profiles as NetworkManager already holds them in memory, so
  # a changed profile on disk is ignored until this runs. It does not disturb
  # an active connection.
  ansible.builtin.command:
    cmd: nmcli connection reload
  changed_when: true
