- name: Create Immich Docker network
  community.docker.docker_network:
    name: immich_network

- name: Pull vector search Postgres Docker image
  community.docker.docker_image_pull:
    name: "docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:90724186f0a3517cf6914295b5ab410db9ce23190a2d9d0b9dd6463e3fa298f0"
    pull: not_present

- name: Run Postgres container
  community.docker.docker_container:
    name: "immich-postgres"
    image: "ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:41eacbe83eca995561fe43814fd4891e16e39632806253848efaf04d3c8a8b84"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    volumes:
      - /mnt/storage/config/immich/pg_data:/var/lib/postgresql/data
    env:
      POSTGRES_DB: "immich"
      POSTGRES_PASSWORD: "{{ immich_db_password }}"
      POSTGRES_USER: "immich"
      POSTGRES_INITDB_ARGS: '--data-checksums'
      DB_STORAGE_TYPE: "HDD"
    networks:
      - name: immich_network
    shm_size: 128MB

- name: Pull the Immich Redis container
  community.docker.docker_image_pull:
    name: "docker.io/redis:6.2-alpine@sha256:eaba718fecd1196d88533de7ba49bf903ad33664a92debb24660a922ecd9cac8"
    pull: not_present

- name: Run the Immich Redis container
  community.docker.docker_container:
    name: "immich-redis"
    image: "docker.io/redis:6.2-alpine@sha256:eaba718fecd1196d88533de7ba49bf903ad33664a92debb24660a922ecd9cac8"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: immich_network

- name: Create the Immich config directory
  ansible.builtin.file:
    path: /mnt/storage/config/immich/conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Template the Immich configuration
  # no_log because the rendered file carries the OIDC client secret.
  ansible.builtin.template:
    src: immich-config.json.j2
    dest: /mnt/storage/config/immich/conf/immich.json
    owner: root
    group: root
    mode: '0644'
  no_log: true

- name: Pull the Immich Docker image
  community.docker.docker_image_pull:
    name: "ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb"
    pull: not_present

- name: Run Immich container
  community.docker.docker_container:
    name: "immich-server"
    image: "ghcr.io/immich-app/immich-server:v3.1.0@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    volumes:
      - /mnt/tmdas/immich/upload:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
      - /mnt/storage/config/immich/conf:/config:ro
    comparisons:
      # Without this, removing a volume from the list above does nothing at all.
      # docker_container defaults to allow_more_present for volumes, meaning a
      # running container holding mounts the spec no longer lists is considered
      # a match — so the spec can only ever add, never take away. A stale
      # /external mount survived several deploys because of it.
      volumes: strict
    networks:
      - name: caddy_network
      - name: immich_network
    env:
      TZ: "Europe/London"
      DB_HOSTNAME: "immich-postgres"
      DB_DATABASE_NAME: "immich"
      DB_USERNAME: "immich"
      DB_PASSWORD: "{{ immich_db_password }}"
      REDIS_HOSTNAME: "immich-redis"
      # Its settings become read-only in Immich's admin interface.
      IMMICH_CONFIG_FILE: /config/immich.json

