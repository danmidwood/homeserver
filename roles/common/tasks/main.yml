- name: Install packages
  pacman:
    name:
      - emacs
      - less
      # Arch ships no log rotation of its own. Without logrotate, /var/log/btmp
      # grows forever -- this host's SSH port is reachable from the internet and
      # collects a failed login every few seconds, which reached 538 MB in the
      # first two years. logrotate.conf already carries btmp and wtmp rules, so
      # installing the package and enabling its timer is the whole fix.
      - logrotate
      # Provides paccache, which trims /var/cache/pacman/pkg. Pacman never
      # prunes that cache on its own; it had reached 5.4 GB.
      - pacman-contrib
    state: present

- name: Set timezone
  community.general.timezone:
    name: "Europe/London"

- name: Enable network time synchronisation
  # Without this the clock free-runs: it had drifted nearly nine minutes.
  # Vaultwarden's TOTP codes tolerate roughly 30 seconds of skew, so a
  # drifting clock silently breaks two-factor auth, and every timestamp the
  # monitoring stack records is wrong by the same amount.
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Set locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#en_GB.UTF-8 UTF-8'
    line: 'en_GB.UTF-8 UTF-8'
    state: present

- name: Comment out all other locales
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^(?!#en_GB.UTF-8 UTF-8)'
    line: '# \0'
    state: present

- name: Generate locale
  ansible.builtin.command: locale-gen
  changed_when: false

- name: Set LANG environment variable
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    line: 'LANG=en_GB.UTF-8'
    create: true

- name: Set hostname
  ansible.builtin.hostname:
    name: xps.home.danmidwood.com
    use: systemd

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Cap the size of the systemd journal
  # Left at its default the journal sizes itself against the filesystem, which
  # on this host's 47 GB /var meant it grew to 3.5 GB before anyone looked. The
  # journal is the first thing read when something breaks, but months of it are
  # not needed to answer that; 500 MB covers weeks on this machine.
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size-limit.conf
    content: |
      # Managed by Ansible. Do not edit on the host.
      [Journal]
      SystemMaxUse=500M
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald

- name: Create the coredump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Cap the space systemd-coredump may consume
  # A single monerod crash wrote a 1.5 GB compressed core here, which is what
  # tipped /var into a disk alert. Coredumps stay enabled because they are the
  # only evidence left after a daemon dies, but an unbounded pile of them is a
  # worse problem than the crash. ProcessSizeMax discards dumps from processes
  # too large to be worth keeping, before any of it reaches the disk.
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/size-limit.conf
    content: |
      # Managed by Ansible. Do not edit on the host.
      [Coredump]
      MaxUse=1G
      ProcessSizeMax=2G
    owner: root
    group: root
    mode: '0644'

- name: Enable log rotation
  # The timer is what actually runs logrotate; the package alone does nothing.
  ansible.builtin.systemd:
    name: logrotate.timer
    enabled: true
    state: started

- name: Enable the pacman cache trim
  # Ships with pacman-contrib and runs `paccache -r`, keeping the three most
  # recent versions of each package so a downgrade is still possible offline.
  ansible.builtin.systemd:
    name: paccache.timer
    enabled: true
    state: started
