- name: Install packages
  pacman:
    name:
      - emacs
      - less
      # Arch ships no log rotation of its own. logrotate.conf already carries
      # btmp and wtmp rules, which matters because this host's SSH port is
      # reachable from the internet and btmp grows accordingly.
      - logrotate
      - pacman-contrib
      # openssl generates Authelia's secrets, Vikunja's signing key and the
      # FTPS certificate; python runs the Arch news collector. Both were
      # present only as dependencies of something else, which is not the same
      # as being required.
      - openssl
      - python
      # Reached for when something is wrong, which is not the moment to
      # discover they are missing.
      - htop
      - lsof
      - tmux
      - vim
      - wget
      - unzip
    state: present
    # Declared packages are explicitly installed, not dependencies. Without
    # this an already-present package keeps whatever reason it had, so
    # something this repository requires can still be removed as an orphan
    # when whatever happened to pull it in goes away.
    reason: explicit
    reason_for: all

- name: Set timezone
  community.general.timezone:
    name: "Europe/London"

- name: Enable network time synchronisation
  # Without this the clock free-runs: it had drifted nearly nine minutes.
  # Vaultwarden's TOTP codes tolerate roughly 30 seconds of skew, so a
  # drifting clock silently breaks two-factor auth, and every timestamp the
  # monitoring stack records is wrong by the same amount.
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: true
    state: started

- name: Set locale
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#en_GB.UTF-8 UTF-8'
    line: 'en_GB.UTF-8 UTF-8'
    state: present

- name: Comment out all other locales
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^(?!#en_GB.UTF-8 UTF-8)'
    line: '# \0'
    state: present

- name: Generate locale
  ansible.builtin.command: locale-gen
  changed_when: false

- name: Set LANG environment variable
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    line: 'LANG=en_GB.UTF-8'
    create: true

- name: Set hostname
  ansible.builtin.hostname:
    name: xps.home.danmidwood.com
    use: systemd

- name: Create the journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Cap the size of the systemd journal
  # 500 MB covers weeks on this machine. Uncapped, the journal sizes itself
  # against the filesystem and grows to gigabytes.
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size-limit.conf
    content: |
      # Managed by Ansible. Do not edit on the host.
      [Journal]
      SystemMaxUse=500M
    owner: root
    group: root
    mode: '0644'
  notify: Restart journald

- name: Create the coredump drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Cap the space systemd-coredump may consume
  # Coredumps are the only evidence left after a daemon dies, so they stay
  # enabled. ProcessSizeMax discards dumps from very large processes before
  # any of it reaches the disk; a single monerod core was 1.5 GB compressed.
  ansible.builtin.copy:
    dest: /etc/systemd/coredump.conf.d/size-limit.conf
    content: |
      # Managed by Ansible. Do not edit on the host.
      [Coredump]
      MaxUse=1G
      ProcessSizeMax=2G
    owner: root
    group: root
    mode: '0644'

- name: Enable log rotation
  ansible.builtin.systemd:
    name: logrotate.timer
    enabled: true
    state: started

- name: Enable the pacman cache trim
  # Runs `paccache -r`, keeping the three most recent versions of each package
  # so a downgrade is still possible offline.
  ansible.builtin.systemd:
    name: paccache.timer
    enabled: true
    state: started
