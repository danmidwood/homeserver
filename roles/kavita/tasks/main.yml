- name: Ensure Python requests is installed
  ansible.builtin.package:
    name:
      - python-requests
    state: present

- name: Pull the Kavita Docker image
  community.docker.docker_image_pull:
    name: "linuxserver/kavita:v0.9.0.2-ls120@sha256:7e3be67100797e264756e9a1a9c6dd821c5dc0950b7940a645a629a429831118"
    pull: not_present

- name: Run Kavita container
  community.docker.docker_container:
    name: "kavita"
    image: "linuxserver/kavita:v0.9.0.2-ls120@sha256:7e3be67100797e264756e9a1a9c6dd821c5dc0950b7940a645a629a429831118"
    labels:
      # Watched by Diun. watch_repo lists the repository's tags and reports
      # newer ones -- necessary because the digest pin above freezes the
      # digest, so watching this exact reference would report nothing.
      # No include_tags or exclude_tags: a tag pattern that fails to match a
      # repository's convention produces no error and no signal, so a missed
      # release would never announce itself. Filtering follows once there is
      # real traffic to write it from.
      diun.enable: "true"
      diun.watch_repo: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      diun.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    volumes:
      - kavita_config:/config
      - /mnt/tmdas/Books:/books
    env:
      TZ: "Europe/London"
      PUID: "1000"
      GUID: "1000"
