- name: Ensure Python requests is installed
  ansible.builtin.package:
    name:
      - python-requests
    state: present

- name: Create the Kavita config directory
  # A bind mount under /mnt/storage rather than a named docker volume. Named
  # volumes live on the DAS array, which runs without redundancy, and nothing
  # backs them up; this path is on the internal disk and in backup_paths.
  ansible.builtin.file:
    path: /mnt/storage/config/kavita
    state: directory
    owner: daniel
    group: daniel
    mode: '0755'

- name: Pull the Kavita Docker image
  community.docker.docker_image_pull:
    name: "linuxserver/kavita:v0.9.1.4-ls123@sha256:9ab54dfa133ca038992cea019490c951843712dcb66fec518a01f25d076ef335"
    pull: not_present

- name: Run Kavita container
  community.docker.docker_container:
    name: "kavita"
    image: "linuxserver/kavita:v0.9.1.4-ls123@sha256:9ab54dfa133ca038992cea019490c951843712dcb66fec518a01f25d076ef335"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    volumes:
      - /mnt/storage/config/kavita:/config
      - /mnt/tmdas/Books:/books
    env:
      TZ: "Europe/London"
      PUID: "1000"
      GUID: "1000"
