- name: Pull the Grafana Docker image
  community.docker.docker_image_pull:
    name: "grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283"
    pull: not_present

- name: Create the Grafana data directory
  # A bind mount on the internal disk rather than a named docker volume: those
  # live on the DAS array, which runs without redundancy. Owned by uid 472, the
  # user the upstream image runs as.
  #
  # Deliberately not in backup_paths. What it holds -- users, preferences,
  # annotations -- is small and easily recreated, while the dashboards, the
  # datasource and the alert rules are all deployed from this repository.
  ansible.builtin.file:
    path: /mnt/storage/config/grafana/data
    state: directory
    owner: '472'
    group: '0'
    mode: '0755'

- name: Create Grafana datasource provisioning directory
  ansible.builtin.file:
    path: /mnt/storage/config/grafana/provisioning/datasources
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Provision the Prometheus datasource
  ansible.builtin.copy:
    src: datasource-prometheus.yml
    dest: /mnt/storage/config/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Grafana

- name: Create Grafana dashboard provisioning directory
  ansible.builtin.file:
    path: /mnt/storage/config/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create Grafana dashboards directory
  # Deliberately NOT inside provisioning/: Grafana would try to parse the
  # provider YAML as a dashboard and log errors on every scan.
  ansible.builtin.file:
    path: /mnt/storage/config/grafana/dashboards
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Provision the dashboard provider
  ansible.builtin.copy:
    src: dashboard-provider.yml
    dest: /mnt/storage/config/grafana/provisioning/dashboards/homeserver.yml
    owner: root
    group: root
    mode: '0644'
  notify: Restart Grafana

- name: Copy dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/mnt/storage/config/grafana/dashboards/{{ item | basename }}"
    owner: root
    group: root
    mode: '0644'
  with_fileglob:
    - "dashboards/*.json"
  notify: Restart Grafana

- name: Find deployed dashboards
  ansible.builtin.find:
    paths: /mnt/storage/config/grafana/dashboards
    patterns: "*.json"
  register: grafana_deployed_dashboards

- name: Remove dashboards no longer in the repository
  # The copy above only ever adds or updates. Without this, a dashboard
  # renamed or deleted from the repo lingers on the server forever.
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  with_items: "{{ grafana_deployed_dashboards.files }}"
  when: (item.path | basename) not in grafana_repo_dashboards
  vars:
    grafana_repo_dashboards: "{{ query('fileglob', role_path + '/files/dashboards/*.json') | map('basename') | list }}"
  notify: Restart Grafana

- name: Run Grafana container
  community.docker.docker_container:
    name: "grafana"
    image: "grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283"
    labels:
      # Checked daily against the registry's tag list for anything newer
      # than the tag pinned above. The digest pin freezes this exact
      # reference, so the useful signal is a new tag, not a new digest.
      imagewatch.enable: "true"
      # Excluded rather than included, deliberately. An exclude pattern that
      # is wrong produces visible noise; an include pattern that is wrong
      # produces silence, and a release that never arrives never announces
      # itself. These three shapes are provably not releases: per-commit
      # builds (actualbudget publishes 2883 tags, of which 99.9% are these),
      # bare commit hashes, and rolling branch builds. Real version tags of
      # every convention in use here are left untouched, including
      # v0.9.0.2-ls120, 16-alpine and 1.43.3.10896-cb3ebc72d.
      imagewatch.exclude_tags: "^sha-;^[0-9a-f]{7,40}$;^(main|master|edge|nightly|dev|develop|canary)([.-]|$)"
    state: started
    restart_policy: always
    networks:
      - name: caddy_network
    volumes:
      - /mnt/storage/config/grafana/data:/var/lib/grafana
      - /mnt/storage/config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - /mnt/storage/config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - /mnt/storage/config/grafana/dashboards:/etc/grafana/dashboards:ro
    env:
      GF_SECURITY_ADMIN_USER: "admin"
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_SERVER_ROOT_URL: "https://grafana.home.danmidwood.com"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authelia"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ authelia_client_secret.grafana }}"
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ authelia_url }}/api/oidc/authorization"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ authelia_url }}/api/oidc/token"
      GF_AUTH_GENERIC_OAUTH_API_URL: "{{ authelia_url }}/api/oidc/userinfo"
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: "preferred_username"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "groups"
      # Everything this Grafana serves -- dashboards, the datasource, the alert
      # rules -- is deployed from this repository, so the day-to-day login only
      # needs to read it. The local admin account covers the rest.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Viewer'"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      # Authelia is the only way in through the interface. The local admin
      # account still authenticates against the HTTP API with basic auth, which
      # is what remains for the rare administrative task.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
