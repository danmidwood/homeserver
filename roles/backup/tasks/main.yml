- name: Ensure B2 backup credentials are configured
  ansible.builtin.assert:
    that:
      - backup_b2_bucket | default('') | length > 0
      - backup_b2_endpoint | default('') | length > 0
      - backup_b2_key_id | default('') | length > 0
      - backup_b2_application_key | default('') | length > 0
      - backup_restic_password | default('') | length > 0
    fail_msg: "backup_b2_bucket, backup_b2_endpoint, backup_b2_key_id, backup_b2_application_key and backup_restic_password must all be set in user_passwords.yml"

- name: Install restic and jq
  # jq builds the Alertmanager JSON payload in backup-alert.sh.
  pacman:
    name:
      - restic
      - jq
    state: present

- name: Create restic credentials directory
  file:
    path: /etc/restic
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Template restic environment file
  template:
    src: restic.env.j2
    dest: /etc/restic/env
    owner: root
    group: root
    mode: '0600'

- name: Create database dump staging directory
  file:
    path: /mnt/storage/backup/db-dumps
    state: directory
    owner: daniel
    group: daniel
    mode: '0755'

- name: Create the restore-drill canary directory
  # The canary is what the weekly restore drill restores and compares. A real
  # user file would be a better subject, but nothing here is stable enough to
  # compare against: anything worth backing up changes, and a mismatch caused by
  # a legitimate edit would be a false alarm every time.
  ansible.builtin.file:
    path: /mnt/storage/backup/canary
    state: directory
    owner: daniel
    group: daniel
    mode: '0755'

- name: Write the restore-drill canary
  # Deliberately static. If the content changed on every run, a restore of
  # yesterday's snapshot would never match today's live file.
  ansible.builtin.copy:
    content: |
      This file exists so the weekly restore drill has something with known
      content to restore and compare. It is written by Ansible and must not
      change: restic-restore-check.sh restores it from the latest snapshot and
      compares its hash against this copy, so an edit here would look like a
      corrupted backup until the next nightly backup runs.
    dest: /mnt/storage/backup/canary/canary.txt
    owner: daniel
    group: daniel
    mode: '0644'

- name: Install the restore drill script
  ansible.builtin.copy:
    src: restic-restore-check.sh
    dest: /usr/local/bin/restic-restore-check.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the restore drill unit
  ansible.builtin.copy:
    src: restic-restore-check.service
    dest: /etc/systemd/system/restic-restore-check.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install the restore drill timer
  ansible.builtin.copy:
    src: restic-restore-check.timer
    dest: /etc/systemd/system/restic-restore-check.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Template backup script
  template:
    src: restic-backup.sh.j2
    dest: /usr/local/bin/restic-backup.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the backup failure alert script
  copy:
    src: backup-alert.sh
    dest: /usr/local/bin/backup-alert.sh
    owner: root
    group: root
    mode: '0755'

- name: Install the backup failure alert unit
  copy:
    src: backup-alert.service
    dest: /etc/systemd/system/backup-alert.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install restic systemd service
  copy:
    src: restic-backup.service
    dest: /etc/systemd/system/restic-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install restic systemd timer
  copy:
    src: restic-backup.timer
    dest: /etc/systemd/system/restic-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Flush handlers so systemd sees new units before enabling
  meta: flush_handlers

- name: Enable and start the restic backup timer
  systemd:
    name: restic-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable and start the restore drill timer
  systemd:
    name: restic-restore-check.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Initialise restic repository if not already initialised
  # --no-lock is required, not merely tidy. Backblaze B2's S3 API rejects the
  # storage class header restic sends when it writes a lock object ("Storage
  # class not supported on this cluster: STANDARD"), so any restic command
  # that takes a lock fails on this backend. Without --no-lock this existence
  # check failed on an already-initialised repository, fell through to
  # `restic init`, and failed the whole play with "repository master key and
  # config already initialized" -- on a repository that was healthy and being
  # backed up nightly.
  #
  # Reading snapshots needs no lock in any case; taking one to answer "does
  # this repository exist" was always wrong.
  ansible.builtin.shell: |
    set -a
    . /etc/restic/env
    set +a
    restic snapshots --no-lock >/dev/null 2>&1 || restic init
  args:
    executable: /bin/bash
  changed_when: false
