backup_retention_daily: 14
backup_retention_weekly: 8
backup_retention_monthly: 12

backup_paths:
  - /mnt/storage/backup/db-dumps
  # The restore drill's canary. Must be backed up, or there is nothing to
  # restore and compare.
  - /mnt/storage/backup/canary
  # The generated Authelia secrets, above all storage_encryption_key: nothing
  # can reconstruct it, and without it the registered passkeys in a restored
  # database cannot be decrypted.
  - /mnt/storage/config/authelia
  - /mnt/storage/config/actual-budget/data
  - /mnt/storage/config/kavita
  # Attachments, and the signing secret that keeps sessions valid.
  - /mnt/storage/config/vikunja/files
  - /mnt/storage/config/vikunja/secrets
  - /mnt/storage/config/vaultwarden
  - /mnt/tmdas/immich
  - /mnt/tmdas/Books
  - /mnt/tmdas/Documents
  - /mnt/tmdas/Dev
  - /mnt/tmdas/Piano
  # Temporary storage, but backed up anyway: restic deduplicates by content, so
  # once a file is moved to an already-backed-up path both snapshots share its
  # chunks, and this covers the window before it is filed.
  - /mnt/storage/telegram-inbox

# Paths under backup_paths that restic skips. Immich regenerates thumbs and
# encoded-video from the originals, and its own backups/ holds database dumps
# that duplicate the pg_dump the backup script already takes.
backup_excludes:
  - /mnt/tmdas/immich/thumbs
  - /mnt/tmdas/immich/encoded-video
  - /mnt/tmdas/immich/backups
